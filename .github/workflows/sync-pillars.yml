name: sync-pillars

# Keep the pillar resource hubs current by importing content from each
# dougdevitre/access-to-* repo. Runs in CI (full GitHub egress, unlike a
# repo-scoped sandbox), commits the regenerated content back to main, and is
# safe to re-run — sync-pillars.mjs is idempotent, so a no-change run commits
# nothing. Trigger manually any time, or on the weekly schedule.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Sync a single pillar (slug, e.g. education). Blank = all."
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: web

concurrency:
  group: sync-pillars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Sync pillar content
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            npm run sync:pillars -- --only "${{ github.event.inputs.only }}"
          else
            npm run sync:pillars
          fi
      - name: Commit changes (if any)
        run: |
          # Stage first, then test the index — `git diff` (working tree) is blind to
          # newly-synced untracked files, so a first-time sync would otherwise look
          # like "no changes" and be discarded. `git diff --cached` sees additions,
          # modifications, and deletions, keeping a true no-op run idempotent.
          git add content/pillars public/pillar-tools
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync pillar content from access-to-* repos [skip ci]"
          git push
