name: a11y

# Accessibility scan (Playwright + axe) of the public site. Separate from the
# required `ci` gate so findings are visible without blocking unrelated merges
# until the route list is tuned — promote to required once public pages are clean.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Accessibility scan
        run: npm run test:a11y
        env:
          NEXT_TELEMETRY_DISABLED: "1"
