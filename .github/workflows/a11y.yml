name: a11y

# Accessibility scan (Playwright + axe) of the public site, plus the nav
# interaction specs (e2e/nav-menu.spec.ts). Public routes are clean, so this is
# now treated as a gate: it runs on every PR AND on push to main, so a
# regression that slips past a PR (e.g. a stale-check race on a fast-forward)
# is still caught on main. Not yet wired into branch protection — main ships by
# fast-forward, where the gate is enforced by waiting for this check green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Accessibility scan
        run: npm run test:a11y
        env:
          NEXT_TELEMETRY_DISABLED: "1"
