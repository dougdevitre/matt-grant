name: rebase-command

# Comment "/rebase" on a PR and a bot rebases its branch onto the base and force-pushes
# — so a PR that's fallen "behind main" (the up-to-date check) is unblocked with one
# comment, no local worktree gymnastics. This replaces the manual rebase churn for a
# repo where GitHub's merge queue isn't available (personal-account private repo).
#
# REQUIRES a repo secret `REBASE_PAT` — a PAT with Contents:write + Pull requests:write
# on this repo. The default GITHUB_TOKEN is NOT enough: a push made with it does not
# re-trigger CI, so the up-to-date check would stay red. A PAT-authored push re-runs CI.
#
# issue_comment workflows run from the DEFAULT branch, so this file must be on main.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  rebase:
    # PR comments only, and only when the body contains /rebase
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/rebase')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head/base + ack
        id: pr
        env:
          GH_TOKEN: ${{ secrets.REBASE_PAT }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=+1 >/dev/null 2>&1 || true
          # Resolve via the REST API (reliable with fine-grained PATs; gh pr view's GraphQL can return empty).
          pr=$(gh api "repos/${{ github.repository }}/pulls/${NUM}")
          head=$(echo "$pr" | jq -r '.head.ref // ""')
          base=$(echo "$pr" | jq -r '.base.ref // ""')
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -z "$head" ] || [ -z "$base" ]; then
            echo "::error::could not resolve PR branch (head='$head' base='$base') — check REBASE_PAT has Pull requests: read"
            gh pr comment "${NUM}" --body "⚠️ \`/rebase\` couldn't resolve this PR's branch — REBASE_PAT likely needs **Pull requests: read**."
            exit 1
          fi
          echo "resolved: $head onto $base"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REBASE_PAT }}
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head }}

      - name: Rebase onto base and force-push
        env:
          GH_TOKEN: ${{ secrets.REBASE_PAT }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
          BASE_REF: ${{ steps.pr.outputs.base }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "rebase-bot"
          git config user.email "actions@github.com"
          git fetch origin "$BASE_REF"
          if git rebase "origin/${BASE_REF}"; then
            git push --force-with-lease origin "HEAD:${HEAD_REF}"
            gh pr comment "$NUM" --body "✅ Rebased \`${HEAD_REF}\` onto \`${BASE_REF}\` and force-pushed — CI will re-run."
          else
            git rebase --abort || true
            gh pr comment "$NUM" --body "⚠️ Couldn't auto-rebase \`${HEAD_REF}\` onto \`${BASE_REF}\` (conflicts). Rebase manually: \`git fetch origin && git rebase origin/${BASE_REF} && git push --force-with-lease\`."
            exit 1
          fi
