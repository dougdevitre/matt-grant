name: ci

# Gate every PR (and main) on the checks we rely on locally: lint, the stricter
# Next/tsc typecheck, the vitest suite (RBAC drift, unsubscribe tokens, the C1
# campaign-finalize regression, CHILD-Act scoring), and a keyless production
# build. The app is designed to build without secrets, so no credentials needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  # Fail any PR whose branch is behind its base. CI type-checks/tests/builds the
  # PR-merged-into-base result, but GitHub only regenerates that merge preview when
  # the PR is pushed — NOT when main advances afterward. So a branch cut from an old
  # main can keep a green check that no longer reflects main, and merging it silently
  # drops/duplicates code from PRs that landed in between. This makes "behind base"
  # a red check (a backstop for the "Require branches to be up to date" rule).
  up-to-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }} # the real branch tip, not the merge commit
      - name: Require branch up to date with base
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Branch is up to date with ${{ github.base_ref }}."
          else
            echo "::error::This branch is behind ${{ github.base_ref }}. Rebase first: git fetch origin && git rebase origin/${{ github.base_ref }} && git push --force-with-lease — then CI tests the real merge result."
            exit 1
          fi

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm run test
      - name: Build (keyless)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
