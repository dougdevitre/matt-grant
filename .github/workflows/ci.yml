name: ci

# Gate every PR (and main) on the checks we rely on locally: lint, the stricter
# Next/tsc typecheck, the vitest suite (RBAC drift, unsubscribe tokens, the C1
# campaign-finalize regression, CHILD-Act scoring), and a keyless production
# build. The app is designed to build without secrets, so no credentials needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm run test
      - name: Build (keyless)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
