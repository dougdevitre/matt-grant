name: secrets-sync

# Mirrors SSM parameters under /matt-grant into the Amplify app's runtime env.
# SSM is the source of truth; the Amplify *build* role can't read SSM, so the
# runtime only gets a parameter once it lands in the app's environmentVariables.
# This job keeps them in sync and triggers a release so values materialize.
# Runs daily and on demand. Idempotent (no-ops when nothing changed).

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC
  contents: read

env:
  SSM_PREFIX: /matt-grant
  AWS_REGION: us-east-1
  AMPLIFY_APP_ID: d1roai8s7wowoi
  AMPLIFY_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # needs ssm:GetParametersByPath, kms:Decrypt, amplify:GetApp/UpdateApp/StartJob
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync SSM -> Amplify env
        run: |
          set -euo pipefail

          # 1) Pull SSM params (decrypted); key = leaf name after the last slash.
          aws ssm get-parameters-by-path \
            --path "$SSM_PREFIX" --with-decryption --recursive \
            --query "Parameters[].{Name:Name,Value:Value}" --output json > ssm.json
          echo "SSM params under $SSM_PREFIX: $(jq 'length' ssm.json)"

          # 2) Current Amplify env (preserve non-SSM keys like AMPLIFY_*).
          aws amplify get-app --app-id "$AMPLIFY_APP_ID" \
            --query "app.environmentVariables" --output json > current.json

          # 3) Merge: current overlaid by SSM (SSM is source of truth).
          jq -s '
            (.[0] | map({ (.Name | split("/") | last): .Value }) | add // {}) as $ssm
            | ((.[1] // {}) * $ssm)
          ' ssm.json current.json > merged.json

          # 4) No change? Stop — don't churn a release.
          if jq -e --slurpfile cur current.json '. == $cur[0]' merged.json >/dev/null; then
            echo "No env changes; skipping update + release."
            exit 0
          fi

          # 5) Replace the env map (full merged map) and release.
          jq -n --arg id "$AMPLIFY_APP_ID" --slurpfile env merged.json \
            '{appId:$id, environmentVariables:$env[0]}' > update.json
          aws amplify update-app --cli-input-json file://update.json >/dev/null
          echo "Amplify env updated."

          job=$(aws amplify start-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --job-reason "secrets-sync: SSM -> Amplify" \
            --query "jobSummary.jobId" --output text)
          echo "Release started: job $job"
