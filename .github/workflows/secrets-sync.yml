name: secrets-sync

# Mirrors SSM parameters under /matt-grant/research into the Vercel project's
# production env. SSM is the source of truth; this keeps the Vercel app in sync.
# Runs daily and on demand. Idempotent (Vercel API upsert).

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC
  contents: read

env:
  SSM_PREFIX: /matt-grant/research
  AWS_REGION: us-east-1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync SSM -> Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          aws ssm get-parameters-by-path \
            --path "$SSM_PREFIX" --with-decryption --recursive \
            --query "Parameters[].{Name:Name,Value:Value}" --output json > params.json

          count=$(jq 'length' params.json)
          echo "Found $count parameters under $SSM_PREFIX"

          team_qs=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then team_qs="&teamId=${VERCEL_TEAM_ID}"; fi

          jq -c '.[]' params.json | while read -r p; do
            name=$(jq -r '.Name | split("/") | last' <<<"$p")
            value=$(jq -r '.Value' <<<"$p")
            body=$(jq -n --arg k "$name" --arg v "$value" \
              '{key:$k, value:$v, type:"encrypted", target:["production"]}')
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true${team_qs}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body")
            echo "  $name -> Vercel ($code)"
            case "$code" in 2*) ;; *) echo "::error::failed to upsert $name ($code)"; exit 1 ;; esac
          done

      - name: Trigger redeploy (optional)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" >/dev/null && echo "redeploy triggered"
