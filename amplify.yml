# AWS Amplify Hosting build spec (Next.js SSR). Monorepo: app lives in web/.
# Amplify auto-detects Next.js and runs it as a managed SSR compute (Lambda).
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            # Amplify injects app env vars into the BUILD env but not the SSR
            # runtime. Materialize the server-side vars into .env.production so
            # the Next.js server (and middleware) can read them at runtime.
            - |
              for k in WALGREENS_API_KEY WALGREENS_AFF_ID WALGREENS_PUBLISHER_ID WALGREENS_ENV \
                       DYNAMODB_TABLE AWS_REGION S3_ASSETS_BUCKET ASSETS_CDN_URL \
                       SES_FROM SES_CONFIG_SET \
                       CONGRESS_GOV_API_KEY CRON_SECRET ANTHROPIC_API_KEY ANTHROPIC_MODEL \
                       RESEARCH_BIOGUIDE_ID RESEARCH_VOTE_YEAR RESEARCH_FROM_ROLL RESEARCH_TO_ROLL \
                       FEC_API_KEY RESEARCH_FEC_CYCLE RESEARCH_INCUMBENT_FEC_ID \
                       OPENSTATES_API_KEY CENSUS_API_KEY \
                       RESEARCH_FIELD_JSON RESEARCH_STATEMENTS_JSON \
                       NEXT_PUBLIC_MEDIA_BOOKING_URL NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
                       NEXT_PUBLIC_CLERK_SIGN_IN_URL NEXT_PUBLIC_CLERK_SIGN_UP_URL \
                       CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET ALLOW_OPEN_DASHBOARD DASHBOARD_ALLOWLIST \
                       WINRED_WEBHOOK_SECRET SES_SNS_TOPIC_ARN UNSUB_SECRET; do
                v=$(printenv "$k" 2>/dev/null || true)
                [ -n "$v" ] && echo "$k=$v" >> .env.production
              done
              echo "Materialized $(wc -l < .env.production 2>/dev/null || echo 0) runtime vars into .env.production"
            # RBAC params live in SSM Parameter Store (/matt-grant/*). Pull them
            # into the SSR runtime. Additive + non-fatal: keyless builds and the
            # env-var flow above are unaffected. Requires the Amplify build role
            # to allow ssm:GetParameter on /matt-grant/* (+ kms:Decrypt for the
            # SecureString secret).
            - |
              for k in DASHBOARD_ALLOWLIST CLERK_WEBHOOK_SIGNING_SECRET \
                       ANTHROPIC_API_KEY ANTHROPIC_MODEL CONGRESS_GOV_API_KEY CRON_SECRET FEC_API_KEY \
                       OPENSTATES_API_KEY CENSUS_API_KEY; do
                v=$(aws ssm get-parameter --name "/matt-grant/$k" --with-decryption --region "${AWS_REGION:-us-east-1}" \
                      --query 'Parameter.Value' --output text 2>/dev/null || true)
                if [ -n "$v" ] && [ "$v" != "None" ]; then echo "$k=$v" >> .env.production; fi
              done
              echo "SSM param pull complete."
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
